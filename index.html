<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal Kuliah (bisa diedit)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #E9EEF5;
    --ink: #15202B;
    --muted: #5B6B7B;
    --line: #CFD7E2;
    --btn: #15202B;
    --btn-ink: #FFFFFF;
    --focus: #1D4ED8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E141B;
      --ink: #E6EBF1;
      --muted: #9AA8B7;
      --line: #2A3542;
      --btn: #E6EBF1;
      --btn-ink: #0E141B;
      --focus: #7FA6FF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E141B;
    --ink: #E6EBF1;
    --muted: #9AA8B7;
    --line: #2A3542;
    --btn: #E6EBF1;
    --btn-ink: #0E141B;
    --focus: #7FA6FF;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }

  .intro { margin: 0 0 14px; color: var(--muted); font-size: 14px; max-width: 60ch; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .btn {
    font: inherit; font-weight: 700; font-size: 14px;
    padding: 10px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn:focus-visible, .mini:focus-visible, .x:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ===== Kartu yang jadi gambar (warna tetap, tidak ikut tema) ===== */
  .card {
    max-width: 680px; margin: 0 auto;
    background: #FFFFFF; color: #15202B;
    border-radius: 22px; padding: 28px 22px 26px;
    box-shadow: 0 14px 34px -18px rgba(20, 33, 61, .35);
  }
  .card.exporting { border-radius: 0; box-shadow: none; }
  .card.exporting [data-ph]:empty::before { content: ""; }

  .title { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 6px; }

  [contenteditable] { outline: none; border-radius: 6px; cursor: text; }
  [contenteditable]:hover { background: rgba(21, 32, 43, .06); }
  [contenteditable]:focus { background: rgba(29, 78, 216, .10); box-shadow: 0 0 0 2px #1D4ED8; }
  [data-ph]:empty::before { content: attr(data-ph); color: #9AA8B7; font-weight: 500; }

  .day { margin-top: 22px; }
  .dayhead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dname { font-size: 17px; font-weight: 800; color: var(--c); min-width: 3ch; padding: 0 4px; margin-left: -4px; }
  .tools { margin-left: auto; display: flex; gap: 2px; }
  .mini {
    font: inherit; font-size: 12px; font-weight: 600; color: #5B6B7B;
    background: none; border: 0; padding: 5px 8px; border-radius: 8px; cursor: pointer;
  }
  .mini:hover { background: rgba(21, 32, 43, .07); }
  .mini.warn { color: #BE123C; background: #FCE3EA; }

  .row {
    display: grid; grid-template-columns: 7.6rem 1fr 1.75rem;
    gap: 10px 12px; align-items: start; padding: 8px 0;
  }
  .time {
    display: inline-block; width: fit-content; max-width: 100%;
    background: var(--t); color: var(--c);
    font-weight: 700; font-size: 12.5px; line-height: 1.35;
    padding: 5px 9px; border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }
  .name { font-weight: 700; font-size: 15.5px; line-height: 1.3; padding: 1px 4px; margin: 0 -4px; }
  .place { color: #5B6B7B; font-size: 13.5px; margin-top: 1px; padding: 1px 4px; margin-left: -4px; margin-right: -4px; }
  .x {
    width: 1.75rem; height: 1.75rem; border: 0; border-radius: 50%;
    background: transparent; color: #9AA8B7; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .x:hover { background: #FCE3EA; color: #BE123C; }

  .empty { color: #9AA8B7; font-size: 13px; padding: 6px 0; }

  /* ===== Toast & overlay ===== */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--btn); color: var(--btn-ink);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .78);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px; z-index: 10; overflow: auto;
  }
  .overlay.show { display: flex; }
  .overlay img { max-width: 100%; max-height: 78%; background: #fff; border-radius: 8px; }
  .overlay p { color: #fff; margin: 0; font-size: 14px; text-align: center; }

  @media (max-width: 480px) {
    .card { padding: 24px 16px 22px; }
    .title { font-size: 24px; }
    .row { grid-template-columns: 6.9rem 1fr 1.75rem; gap: 8px 10px; }
  }
</style>
</head>
<body>
<main>
  <p class="intro">Klik teks mana saja di kartu untuk mengubahnya. Kalau sudah pas, tekan <b>Simpan sebagai gambar</b>. Perubahan tersimpan otomatis di browser ini.</p>
  <div class="toolbar">
    <button class="btn primary" id="save">Simpan sebagai gambar</button>
    <button class="btn" id="addDay">Tambah hari</button>
    <button class="btn" id="reset">Kembalikan ke awal</button>
  </div>

  <section class="card" id="card" aria-label="Jadwal kuliah">
    <div id="titleWrap"></div>
    <div id="days"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay">
  <img id="ovImg" alt="Jadwal kuliah dalam bentuk gambar">
  <p>Tekan dan tahan gambar untuk menyimpan. Ketuk di mana saja untuk menutup.</p>
</div>

<script>
(function () {
  var COLORS = [
    { c: "#1D4ED8", t: "#E3ECFF" },
    { c: "#0F766E", t: "#DDF3EF" },
    { c: "#B45309", t: "#FCEBD0" },
    { c: "#6D28D9", t: "#EDE4FD" },
    { c: "#BE123C", t: "#FCE3EA" },
    { c: "#4D7C0F", t: "#E8F3D3" }
  ];
  var KEY = "jadwal-kuliah-v1";

  function defaults() {
    return {
      title: "Jadwal Kuliah Semester 3",
      days: [
        { d: "Senin", c: 0, r: [
          { t: "08:20 - 09:00 WIB", n: "Expository and Persuasive Writing", p: "Lab Bahasa dan Komputer" },
          { t: "12:20 - 13:00 WIB", n: "Grammar in Discourse", p: "Lab Teknik Mesin" }
        ]},
        { d: "Selasa", c: 1, r: [
          { t: "08:20 - 09:00 WIB", n: "Listening for Academic Discourse 1", p: "Lab Microteaching" },
          { t: "12:20 - 13:00 WIB", n: "World Literature", p: "Lab Microteaching" }
        ]},
        { d: "Rabu", c: 2, r: [
          { t: "18:20 - 19:00 WIB", n: "Extensive Reading", p: "Lab Teknik Mesin" }
        ]},
        { d: "Kamis", c: 3, r: [
          { t: "15:40 - 16:20 WIB", n: "Pengantar Ilmu Linguistik", p: "Lab Teknik Mesin" }
        ]},
        { d: "Jumat", c: 4, r: [
          { t: "12:20 - 13:00 WIB", n: "Prose", p: "Lab Otomotif" },
          { t: "13:40 - 14:20 WIB", n: "Introduction to Phonetics & Phonology", p: "Lab Otomotif" },
          { t: "15:40 - 16:20 WIB", n: "Public Speaking", p: "Lab Otomotif" }
        ]}
      ]
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.days)) return s;
      }
    } catch (e) {}
    return defaults();
  }
  var saveTimer = null;
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 250);
  }

  var state = load();
  var $ = function (s) { return document.querySelector(s); };
  var IGNORE = "data-html2canvas-ignore";

  function editable(tag, cls, value, ph, onInput) {
    var el = document.createElement(tag);
    el.className = cls;
    el.contentEditable = "true";
    el.spellcheck = false;
    el.setAttribute("data-ph", ph);
    el.textContent = value;
    el.addEventListener("input", function () { onInput(el.textContent); persist(); });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });
    el.addEventListener("paste", function (e) {
      e.preventDefault();
      var t = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\s*\n\s*/g, " ");
      document.execCommand("insertText", false, t);
    });
    return el;
  }

  function button(cls, label, onClick, aria) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = label;
    if (aria) b.setAttribute("aria-label", aria);
    b.setAttribute(IGNORE, "true");
    b.addEventListener("click", onClick);
    return b;
  }

  function render() {
    var tw = $("#titleWrap");
    tw.textContent = "";
    tw.appendChild(editable("h2", "title", state.title, "Judul jadwal", function (v) { state.title = v; }));

    var wrap = $("#days");
    wrap.textContent = "";

    state.days.forEach(function (day, di) {
      var col = COLORS[day.c % COLORS.length];
      var sec = document.createElement("div");
      sec.className = "day";
      sec.dataset.i = di;
      sec.style.setProperty("--c", col.c);
      sec.style.setProperty("--t", col.t);

      var head = document.createElement("div");
      head.className = "dayhead";
      head.appendChild(editable("span", "dname", day.d, "Nama hari", function (v) { day.d = v; }));

      var tools = document.createElement("div");
      tools.className = "tools";
      tools.setAttribute(IGNORE, "true");
      tools.appendChild(button("mini", "+ Kelas", function () {
        day.r.push({ t: "", n: "", p: "" });
        persist(); render();
        var last = document.querySelector('.day[data-i="' + di + '"] .row:last-of-type .time');
        if (last) last.focus();
      }));
      var del = button("mini", "Hapus hari", function () {
        if (del.dataset.armed) {
          state.days.splice(di, 1);
          persist(); render();
        } else {
          del.dataset.armed = "1";
          del.textContent = "Yakin hapus?";
          del.classList.add("warn");
          setTimeout(function () {
            if (del.isConnected) {
              del.dataset.armed = "";
              del.textContent = "Hapus hari";
              del.classList.remove("warn");
            }
          }, 3000);
        }
      });
      tools.appendChild(del);
      head.appendChild(tools);
      sec.appendChild(head);

      if (!day.r.length) {
        var em = document.createElement("div");
        em.className = "empty";
        em.setAttribute(IGNORE, "true");
        em.textContent = "Belum ada kelas. Tekan + Kelas untuk menambah.";
        sec.appendChild(em);
      }

      day.r.forEach(function (row, ri) {
        var r = document.createElement("div");
        r.className = "row";
        r.appendChild(editable("div", "time", row.t, "08:20 - 09:00 WIB", function (v) { row.t = v; }));
        var body = document.createElement("div");
        body.appendChild(editable("div", "name", row.n, "Nama mata kuliah", function (v) { row.n = v; }));
        body.appendChild(editable("div", "place", row.p, "Ruangan / lokasi", function (v) { row.p = v; }));
        r.appendChild(body);
        r.appendChild(button("x", "\u00D7", function () {
          day.r.splice(ri, 1);
          persist(); render();
        }, "Hapus kelas"));
        sec.appendChild(r);
      });

      wrap.appendChild(sec);
    });
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  function showOverlay(dataUrl) {
    $("#ovImg").src = dataUrl;
    $("#overlay").classList.add("show");
  }
  $("#overlay").addEventListener("click", function () { this.classList.remove("show"); });

  async function exportPng() {
    var btn = $("#save");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (typeof html2canvas !== "function") { toast("Pustaka gambar belum termuat. Coba muat ulang halaman."); return; }
    btn.disabled = true;
    var oldLabel = btn.textContent;
    btn.textContent = "Membuat gambar\u2026";
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      var canvas = await html2canvas($("#card"), {
        scale: 2,
        backgroundColor: "#FFFFFF",
        windowWidth: 800,
        onclone: function (doc) {
          var c = doc.getElementById("card");
          c.style.width = "680px";
          c.style.maxWidth = "none";
          c.classList.add("exporting");
        }
      });
      var blob = await new Promise(function (res) { canvas.toBlob(res, "image/png"); });
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (!blob || isIOS) {
        // iOS Safari sering menolak unduhan otomatis, jadi tampilkan gambarnya untuk ditahan lama
        showOverlay(canvas.toDataURL("image/png"));
      } else {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "jadwal-kuliah.png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        toast("Gambar diunduh (cek folder Download)");
      }
    } catch (e) {
      toast("Gagal membuat gambar. Coba lagi.");
    } finally {
      btn.disabled = false;
      btn.textContent = oldLabel;
    }
  }

  $("#save").addEventListener("click", exportPng);

  $("#addDay").addEventListener("click", function () {
    var next = state.days.length ? (state.days[state.days.length - 1].c + 1) % COLORS.length : 0;
    state.days.push({ d: "", c: next, r: [{ t: "", n: "", p: "" }] });
    persist(); render();
    var el = document.querySelector(".day:last-child .dname");
    if (el) { el.focus(); el.scrollIntoView({ block: "center" }); }
  });

  var resetBtn = $("#reset");
  var resetTimer = null;
  resetBtn.addEventListener("click", function () {
    if (resetBtn.dataset.armed) {
      state = defaults();
      persist(); render();
      resetBtn.dataset.armed = "";
      resetBtn.textContent = "Kembalikan ke awal";
      toast("Jadwal dikembalikan ke awal");
    } else {
      resetBtn.dataset.armed = "1";
      resetBtn.textContent = "Yakin? Semua perubahan hilang";
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        resetBtn.dataset.armed = "";
        resetBtn.textContent = "Kembalikan ke awal";
      }, 3500);
    }
  });

  render();
})();
</script>
</body>
</html>
